services:

  web:
    build: .
    ports:
      - "8080:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kolibri.rule=Host(`kolibri-inspect.de`) || Host(`www.kolibri-inspect.de`)"
      - "traefik.http.routers.kolibri.entrypoints=websecure"
      - "traefik.http.routers.kolibri.tls=true"
      - "traefik.http.routers.kolibri.tls.certresolver=letsencrypt"
      - "traefik.http.services.kolibri.loadbalancer.server.port=80"
    restart: unless-stopped

  api:
    build: ./api
    volumes:
      - anfragen_data:/data
    environment:
      - PORT=3000
      - DATA_FILE=/data/anfragen.json
      # Diese Datei liegt in einem ÖFFENTLICHEN Repository. Niemals einen
      # echten Token hier eintragen – er kommt aus der .env auf dem VPS.
      # Ohne gesetzten Wert startet der Container bewusst nicht.
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN muss in der .env auf dem VPS gesetzt sein}
      - N8N_WEBHOOK=${N8N_WEBHOOK:-}  # In .env auf VPS setzen
      # Kurzlink-Tabelle der Postmailings. Enthält Empfänger-Firmennamen und
      # gehört deshalb nicht ins öffentliche Repo – per docker compose cp in
      # das anfragen_data-Volume legen, dann greift dieser Pfad.
      - SHORT_LINKS_FILE=${SHORT_LINKS_FILE:-/data/short-links.json}
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}      # In .env auf VPS setzen
      - SMTP_PASS=${SMTP_PASS:-}      # In .env auf VPS setzen
      - MAIL_FROM=${MAIL_FROM:-info@kolibri-inspect.de}
      - MAIL_TO=${MAIL_TO:-info@kolibri-inspect.de}
    labels:
      - "traefik.enable=true"
      # Pfad-basiertes Routing: /api/* → API-Container
      - "traefik.http.routers.kolibri-api.rule=(Host(`kolibri-inspect.de`) || Host(`www.kolibri-inspect.de`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.kolibri-api.entrypoints=websecure"
      - "traefik.http.routers.kolibri-api.tls=true"
      - "traefik.http.routers.kolibri-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kolibri-api.priority=100"
      - "traefik.http.services.kolibri-api.loadbalancer.server.port=3000"
      # /api-Prefix vom Pfad abschneiden bevor es an Express weitergegeben wird
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.kolibri-api.middlewares=strip-api@docker"
      # Kurzlinks der Postmailings: kolibri-inspect.de/a/<TOKEN> → API.
      # Eigener Router ohne stripprefix, weil Express die Route als /a/:token
      # kennt. Ohne diese Regel landet der QR-Code beim Static-Container.
      - "traefik.http.routers.kolibri-short.rule=(Host(`kolibri-inspect.de`) || Host(`www.kolibri-inspect.de`)) && PathPrefix(`/a/`)"
      - "traefik.http.routers.kolibri-short.entrypoints=websecure"
      - "traefik.http.routers.kolibri-short.tls=true"
      - "traefik.http.routers.kolibri-short.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kolibri-short.priority=110"
      - "traefik.http.routers.kolibri-short.service=kolibri-api"
    restart: unless-stopped

volumes:
  anfragen_data:
