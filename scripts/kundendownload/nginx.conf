# Passwortgeschützte Kundendownloads unter kolibri-inspect.de/download/<slug>/<datei>
#
# Jeder Kunde bekommt einen zufälligen Slug (Verzeichnis) und eine eigene
# htpasswd-Datei /auth/<slug>.htpasswd. Fehlt die Datei, liefert nginx 500
# statt die Datei offen herauszugeben.
server {
  listen 80;
  server_tokens off;

  # In Anführungszeichen, sonst liest nginx das { des Quantors als Blockbeginn
  location ~ "^/download/(?<slug>[A-Za-z0-9]{16,})/[^/]+$" {
    auth_basic           "KolibriInspect Kundendownload";
    auth_basic_user_file /auth/$slug.htpasswd;
    root /srv;

    add_header Content-Disposition "attachment" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
  }

  location / {
    return 404;
  }
}
